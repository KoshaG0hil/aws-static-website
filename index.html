<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Static Website</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #111827, #1e3a8a);
            color: white;
        }

        .container {
            width: 90%;
            max-width: 800px;
            padding: 50px;
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            color: #dbeafe;
            margin-bottom: 30px;
        }

        .stack {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .tech {
            padding: 10px 16px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
        }

        .status {
            margin-top: 30px;
            font-weight: bold;
            color: #86efac;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🚀 AWS Static Website</h1>

        <p>
            Successfully deployed using a secure, automated CI/CD pipeline.
            Every Git push can now update this website automatically.
        </p>

        <div class="stack">
            <div class="tech">AWS S3</div>
            <div class="tech">CloudFront</div>
            <div class="tech">ACM</div>
            <div class="tech">IAM</div>
            <div class="tech">GitHub Actions</div>
            <div class="tech">OIDC</div>
        </div>

        <div class="status">
            ✓ CI/CD Pipeline Working
        </div>

    </div>

</body>
</html>
