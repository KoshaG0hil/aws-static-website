<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kosha's AWS Cloud Project</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f172a, #2563eb);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 700px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        h2 {
            color: #facc15;
            margin-top: 0;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
        }

        .badge {
            display: inline-block;
            margin: 10px;
            padding: 10px 18px;
            border-radius: 30px;
            background: #22c55e;
            color: white;
            font-weight: bold;
        }

        footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #d1d5db;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>🚀 My AWS Cloud Project</h1>
    <h2>Successfully Deployed!</h2>

    <p>
        This static website is hosted on <strong>Amazon S3</strong>,
        delivered globally using <strong>Amazon CloudFront</strong>,
        and automatically deployed through
        <strong>GitHub Actions CI/CD</strong>.
    </p>

    <div>
        <span class="badge">Amazon S3</span>
        <span class="badge">CloudFront</span>
        <span class="badge">GitHub Actions</span>
    </div>

    <footer>
        Built by <strong>Kosha Gohil</strong> • 2026
    </footer>
</div>

</body>
</html>
